# CI for FlowQR. NOT YET RUN: this file was written in Phase 2 without access to GitHub Actions, so it is unverified until its first run on GitHub. It runs the same
# checks that were run by hand: backend tests against a fresh PostgreSQL 16 (migrations from scratch, row-level security enforced because the app connects as a
# non-superuser), frontend type-check and production build. Everything external (Google, Places, Razorpay, the AI) is a test double in these tests: a green run here
# is "unit and integration tested with doubles", never "validated against Google" (see docs/STAGING_DEPLOYMENT.md section 5).
name: ci
on:
  push:
    branches: [main, "phase-*/**", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: flowqr
          POSTGRES_PASSWORD: flowqr_dev
          POSTGRES_DB: flowqr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowqr -d flowqr_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://flowqr_app:flowqr_app_dev@localhost:5432/flowqr_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://flowqr:flowqr_dev@localhost:5432/flowqr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Create the non-superuser application role (same as db/init/01-app-role.sh)
        run: |
          PGPASSWORD=flowqr_dev psql -h localhost -U flowqr -d flowqr_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE flowqr_app LOGIN PASSWORD 'flowqr_app_dev' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT CONNECT ON DATABASE flowqr_test TO flowqr_app;
          GRANT ALL ON SCHEMA public TO flowqr_app;
          SQL
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          BACKEND_URL: http://api:8000
          NEXT_TELEMETRY_DISABLED: "1"

  secrets-and-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No real environment file or key is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '^\.env\.example$'; then echo "an environment file is tracked"; exit 1; fi
          if git grep -n -E '(rzp_live_[A-Za-z0-9]{8,}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN (RSA |EC )?PRIVATE KEY)' -- ':!docs' ':!*.md' ':!backend/tests' ':!backend/app/core/config.py'; then echo "a key-shaped string is tracked"; exit 1; fi
