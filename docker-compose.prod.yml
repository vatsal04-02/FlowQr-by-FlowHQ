# Production overlay: Caddy terminates TLS (automatic HTTPS) and is the only public entry point.
services:
  api:
    ports: !reset []
  frontend:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?e.g. app.flowqr.co.in}
      CARD_DOMAIN: ${CARD_DOMAIN:?e.g. go.flowqr.co.in}
      ACME_EMAIL: ${ACME_EMAIL:?your email for certificate notices}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, api]
volumes:
  caddy_data:
  caddy_config:
