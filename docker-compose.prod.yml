# Production overlay: Caddy terminates TLS (automatic HTTPS) and is the only public entry point.
x-hardened: &hardened
  REQUIRE_HARDENED: "true"  # app refuses to start unless APP_ENV is staging|production (strict config guard)
  APP_ENV: ${APP_ENV:?set APP_ENV=staging or production}

services:
  migrate:
    environment: *hardened
  api:
    environment: *hardened
    ports: !reset []
  worker:
    environment: *hardened
  beat:
    environment: *hardened
  frontend:
    ports: !reset []
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MARKETING_DOMAIN: ${MARKETING_DOMAIN:?e.g. flowqr.co.in}
      APP_DOMAIN: ${APP_DOMAIN:?e.g. app.flowqr.co.in}
      API_DOMAIN: ${API_DOMAIN:?e.g. api.flowqr.co.in}
      CARD_DOMAIN: ${CARD_DOMAIN:?e.g. go.flowqr.co.in}
      ACME_EMAIL: ${ACME_EMAIL:?your email for certificate notices}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      frontend: { condition: service_healthy }
      api: { condition: service_healthy }
volumes:
  caddy_data:
  caddy_config:
