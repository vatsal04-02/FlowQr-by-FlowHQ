# FlowQR production stack on the SHARED Hostinger VPS (201.18.202.128). An overlay on ../../docker-compose.yml, used ONLY with its own project name and env file:
#
#   cd /opt/flowqr
#   docker compose -p flowqr-production --env-file .env.production -f docker-compose.yml -f deploy/vps/docker-compose.vps.yml <command>
#
# The server already runs the clinic's applications (project gkp-final-build: n8n, Grist, the clinic app and the Caddy that owns ports 80 and 443). NOTHING here touches them:
#  * its own Compose project, network (flowqr-production_default), volumes (flowqr-production_pgdata, _redisdata) and container names (flowqr-production-<service>-1)
#  * the frontend is NOT started here: it is on Vercel (the base compose's frontend service sits behind a profile that is never enabled)
#  * no reverse proxy: ports 80 and 443 belong to the existing Caddy, which runs in a container on the clinic's network and so cannot reach this host's 127.0.0.1. The API is therefore
#    published on TWO private addresses only: 127.0.0.1 (health checks and tests on the server) and the docker0 gateway 172.17.0.1 (what the existing Caddy proxies to).
#    Neither is reachable from the internet. PostgreSQL, Redis, the worker and the scheduler publish nothing at all
#  * hard CPU and memory ceilings, lower CPU priority than the neighbours (cpu_shares), a process cap, and capped log files (Docker's default is unlimited)
x-hardened: &hardened
  REQUIRE_HARDENED: "true"  # the app refuses to start unless APP_ENV is staging|production and the strict config guard passes
  APP_ENV: ${APP_ENV:?set APP_ENV=production}
  WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}  # the WhatsApp section. The base compose file lists variables one by one, so a variable only reaches the app if it is listed here or there. Off unless .env.production says true. The other WHATSAPP_ and META_ variables are NOT passed through yet: add each one here on purpose when it is needed

x-limits: &limits
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  pids_limit: 512
  cpu_shares: 512  # half the default weight: under contention the clinic's containers win

services:
  migrate:
    <<: *limits
    environment: *hardened
    mem_limit: ${FLOWQR_MIGRATE_MEM:-384m}
  api:
    <<: *limits
    environment: *hardened
    ports: !override ["127.0.0.1:${FLOWQR_API_PORT:-18000}:8000", "${FLOWQR_API_DOCKER0:-172.17.0.1}:${FLOWQR_API_PORT:-18000}:8000"]
    mem_limit: ${FLOWQR_API_MEM:-512m}
    cpus: ${FLOWQR_API_CPUS:-0.75}
  worker:
    <<: *limits
    environment: *hardened
    mem_limit: ${FLOWQR_WORKER_MEM:-512m}
    cpus: ${FLOWQR_WORKER_CPUS:-0.75}
  beat:
    <<: *limits
    environment: *hardened
    mem_limit: ${FLOWQR_BEAT_MEM:-192m}
    cpus: ${FLOWQR_BEAT_CPUS:-0.25}
  db:
    <<: *limits
    mem_limit: ${FLOWQR_DB_MEM:-768m}
    cpus: ${FLOWQR_DB_CPUS:-0.75}
  redis:
    <<: *limits
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    mem_limit: ${FLOWQR_REDIS_MEM:-256m}
    cpus: ${FLOWQR_REDIS_CPUS:-0.25}
  frontend:
    profiles: ["never-on-the-vps"]
    ports: !reset []
