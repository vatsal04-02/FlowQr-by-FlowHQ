# FlowQR production stack on the SHARED Hostinger VPS (201.18.202.128). An overlay on ../../docker-compose.yml, used ONLY with its own project name and env file:
#
#   cd /opt/flowqr
#   docker compose -p flowqr-production --env-file .env.production -f docker-compose.yml -f deploy/vps/docker-compose.vps.yml <command>
#
# The server already runs the clinic's applications (project gkp-final-build: n8n, Grist, the clinic app and the Caddy that owns ports 80 and 443). NOTHING here touches them:
#  * its own Compose project, network (flowqr-production_default), volumes (flowqr-production_pgdata, _redisdata) and container names (flowqr-production-<service>-1)
#  * the frontend is NOT started here: it is on Vercel (the base compose's frontend service sits behind a profile that is never enabled)
#  * no reverse proxy: ports 80 and 443 belong to the existing Caddy, which runs in a container on the clinic's network and so cannot reach this host's 127.0.0.1. The API is therefore
#    published on TWO private addresses only: 127.0.0.1 (health checks and tests on the server) and the docker0 gateway 172.17.0.1 (what the existing Caddy proxies to).
#    Neither is reachable from the internet. PostgreSQL, Redis, the worker and the scheduler publish nothing at all
#  * hard CPU and memory ceilings, lower CPU priority than the neighbours (cpu_shares), a process cap, and capped log files (Docker's default is unlimited)
x-hardened: &hardened
  REQUIRE_HARDENED: "true"  # the app refuses to start unless APP_ENV is staging|production and the strict config guard passes
  APP_ENV: ${APP_ENV:?set APP_ENV=production}
  WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}  # the WhatsApp section. The base compose file lists variables one by one, so a variable only reaches the app if it is listed here or there. Off unless .env.production says true. The other WHATSAPP_ and META_ variables are NOT passed through yet: add each one here on purpose when it is needed
  WHATSAPP_CONVERSATIONS_ENABLED: ${WHATSAPP_CONVERSATIONS_ENABLED:-false}  # two-way conversations and the inbox (also needs each business to switch its own on)
  WHATSAPP_ATTRIBUTION_ENABLED: ${WHATSAPP_ATTRIBUTION_ENABLED:-false}  # click-to-WhatsApp attribution (Pro; also needs the inbox)
  WHATSAPP_INTEGRATIONS_ENABLED: ${WHATSAPP_INTEGRATIONS_ENABLED:-false}  # API keys, inbound API and signed outbound webhooks (Pro; also off until a business creates a key)
  WHATSAPP_BOOKING_ENABLED: ${WHATSAPP_BOOKING_ENABLED:-false}  # appointment booking and reminders (also needs each business to switch its own on)
  WHATSAPP_AI_ENABLED: ${WHATSAPP_AI_ENABLED:-false}  # the assistant that answers customers (also needs each business to switch its own on, and the terms switch below)
  WHATSAPP_AI_KILL_SWITCH: ${WHATSAPP_AI_KILL_SWITCH:-false}  # true stops every assistant reply at once
  WHATSAPP_AI_TERMS_VERIFIED: ${WHATSAPP_AI_TERMS_VERIFIED:-false}  # only when the AI provider's written data terms are in hand (docs/WHATSAPP_AUTOMATION.md)
  WHATSAPP_AI_TERMS_PROVIDER: ${WHATSAPP_AI_TERMS_PROVIDER:-}  # the provider those terms are for
  GOOGLE_CONTENT_RETENTION_ENABLED: ${GOOGLE_CONTENT_RETENTION_ENABLED:-false}  # expiry of content taken from the Google Business Profile APIs 30 days after it was first stored (docs/audits/GOOGLE_RETENTION_ARCHITECTURE.md). Off unless .env.production says true
  GOOGLE_CONTENT_RETENTION_DAYS: ${GOOGLE_CONTENT_RETENTION_DAYS:-30}  # 1 to 30 while enabled (Google's published storage limit)
  GOOGLE_CONTENT_RETENTION_ACTION: ${GOOGLE_CONTENT_RETENTION_ACTION:-redact}  # only redact exists
  GOOGLE_CONTENT_DELETE_ON_DISCONNECT: ${GOOGLE_CONTENT_DELETE_ON_DISCONNECT:-false}  # true: disconnecting a Google connection also removes everything taken from Google for it
  # Agency path (docs/audits/GOOGLE_PROJECT_ARCHITECTURE_OPTIONS.md). Every switch is OFF unless .env.production says otherwise. INTERNAL ONLY: the backend refuses anyone who is not a listed FlowHQ operator.
  GOOGLE_AGENCY_MANAGER_ENABLED: ${GOOGLE_AGENCY_MANAGER_ENABLED:-false}
  GOOGLE_AGENCY_OPERATIONS_ENABLED: ${GOOGLE_AGENCY_OPERATIONS_ENABLED:-false}
  GOOGLE_AGENCY_PROJECT_MODEL: ${GOOGLE_AGENCY_PROJECT_MODEL:-}  # only flowhq_own_project exists
  GOOGLE_AGENCY_INTERNAL_ONLY: ${GOOGLE_AGENCY_INTERNAL_ONLY:-false}
  SITES_ENABLED: ${SITES_ENABLED:-false}
  SITES_PROVIDER: ${SITES_PROVIDER:-local}
  SITES_AI_BUILDER_ENABLED: ${SITES_AI_BUILDER_ENABLED:-false}
  GOOGLE_AGENCY_OPERATOR_EMAILS: ${GOOGLE_AGENCY_OPERATOR_EMAILS:-}
  GOOGLE_AGENCY_INTERNAL_DECISION: ${GOOGLE_AGENCY_INTERNAL_DECISION:-}  # the owner's own decision for internal use: NOT a Google approval
  GOOGLE_AGENCY_POLICY_REFERENCE: ${GOOGLE_AGENCY_POLICY_REFERENCE:-}  # Google's written answer, only if one exists. Never invent one
  GOOGLE_AGENCY_LOCATION_GROUP_ID: ${GOOGLE_AGENCY_LOCATION_GROUP_ID:-}  # a complete accounts/<long id> resource name
  GOOGLE_AGENCY_ORGANIZATION_ID: ${GOOGLE_AGENCY_ORGANIZATION_ID:-}
  GOOGLE_AGENCY_INDIVIDUAL_FALLBACK: ${GOOGLE_AGENCY_INDIVIDUAL_FALLBACK:-false}
  GOOGLE_AGENCY_ADOPT_EXISTING_ACCESS: ${GOOGLE_AGENCY_ADOPT_EXISTING_ACCESS:-false}
  GOOGLE_AGENCY_CLIENT_TOKEN_KEEP_HOURS: ${GOOGLE_AGENCY_CLIENT_TOKEN_KEEP_HOURS:-0}
  GOOGLE_AGENCY_SELF_SERVICE_ENABLED: ${GOOGLE_AGENCY_SELF_SERVICE_ENABLED:-false}  # guided self-service onboarding screens and APIs; adds no permission of its own
  AGENCY_TOKEN_ENCRYPTION_KEY: ${AGENCY_TOKEN_ENCRYPTION_KEY:-}  # its own Fernet key, never the customer token key

x-limits: &limits
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  pids_limit: 512
  cpu_shares: 512  # half the default weight: under contention the clinic's containers win

services:
  migrate:
    <<: *limits
    environment: *hardened
    mem_limit: ${FLOWQR_MIGRATE_MEM:-384m}
  api:
    <<: *limits
    environment: *hardened
    ports: !override ["127.0.0.1:${FLOWQR_API_PORT:-18000}:8000", "${FLOWQR_API_DOCKER0:-172.17.0.1}:${FLOWQR_API_PORT:-18000}:8000"]
    mem_limit: ${FLOWQR_API_MEM:-512m}
    cpus: ${FLOWQR_API_CPUS:-0.75}
  worker:
    <<: *limits
    environment: *hardened
    mem_limit: ${FLOWQR_WORKER_MEM:-512m}
    cpus: ${FLOWQR_WORKER_CPUS:-0.75}
  beat:
    <<: *limits
    environment: *hardened
    mem_limit: ${FLOWQR_BEAT_MEM:-192m}
    cpus: ${FLOWQR_BEAT_CPUS:-0.25}
  db:
    <<: *limits
    mem_limit: ${FLOWQR_DB_MEM:-768m}
    cpus: ${FLOWQR_DB_CPUS:-0.75}
  redis:
    <<: *limits
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    mem_limit: ${FLOWQR_REDIS_MEM:-256m}
    cpus: ${FLOWQR_REDIS_CPUS:-0.25}
  frontend:
    profiles: ["never-on-the-vps"]
    ports: !reset []
