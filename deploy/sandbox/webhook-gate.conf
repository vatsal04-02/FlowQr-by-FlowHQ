# What the temporary tunnel may reach: one path, one method, a small body. Everything else is a plain 404 from here and never reaches the application.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    location = /api/v1/webhooks/cashfree {
        limit_except POST { deny all; }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass_request_body on;
        proxy_request_buffering on;   # the application verifies the signature over the exact bytes received
    }
    location / {
        return 404;
    }
}
